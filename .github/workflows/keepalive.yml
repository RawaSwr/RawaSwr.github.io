# Free Supabase projects pause after 7 days without activity.
# This reads one row every 3 days so the project stays awake.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read site content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/site_content?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded $status"
          test "$status" = "200"
